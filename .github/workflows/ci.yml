name: CI and Deployment Workflow

on:
  pull_request:
    branches:
      - "**"
    types: [opened, synchronize, reopened, closed]

env:
  AWS_REGION: us-east-1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_ZONE: us-central1-a
  NODE_VERSION: "18"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install

      - name: Run Tests
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: yarn test

      - name: Configure AWS credentials
        if: github.event.pull_request.merged == true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup GCP credentials
        if: github.event.pull_request.merged == true
        run: |
          echo '{
            "type": "service_account",
            "project_id": "${{ secrets.GCP_PROJECT_ID }}",
            "private_key_id": "${{ secrets.GCP_PRIVATE_KEY_ID }}",
            "private_key": "${{ secrets.GCP_PRIVATE_KEY }}",
            "client_email": "${{ secrets.GCP_CLIENT_EMAIL }}",
            "client_id": "${{ secrets.GCP_CLIENT_ID }}",
            "aws_demo_id": "${{ secrets.AWS_DEMO_ID }}",
            "gcp_demo_id": "${{ secrets.GCP_DEMO_ID }}",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token",
            "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
            "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/${{ secrets.GCP_CLIENT_EMAIL }}"
          }' > gcp-credentials.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-credentials.json

      - name: Install Packer
        if: github.event.pull_request.merged == true
        uses: hashicorp/setup-packer@main
        with:
          version: "1.9.4"

      - name: Initialize Packer
        if: github.event.pull_request.merged == true
        run: packer init .

      - name: Build Packer images
        if: github.event.pull_request.merged == true
        run: |
          packer build \
            -var "aws_profile=default" \
            -var "aws_region=${{ env.AWS_REGION }}" \
            -var "gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var "gcp_zone=${{ env.GCP_ZONE }}" \
            -var "aws_demo_id=${{ secrets.AWS_DEMO_ID }}" \
            -var "gcp_private_key_id=${{ secrets.GCP_PRIVATE_KEY_ID }}" \
            -var "gcp_private_key=${{ secrets.GCP_PRIVATE_KEY }}" \
            -var "gcp_client_email=${{ secrets.GCP_CLIENT_EMAIL }}" \
            -var "gcp_client_id=${{ secrets.GCP_CLIENT_ID }}" \
            -var "gcp_demo_id=${{ secrets.GCP_DEMO_ID }}" \
            -var "app_port=8080" \
            -var "node_version=${{ env.NODE_VERSION }}" \
            packer.pkr.hcl
