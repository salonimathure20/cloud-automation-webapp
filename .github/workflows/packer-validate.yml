name: Packer Validation

on:
  pull_request:
    branches:
      - "**"
    paths:
      - "**.pkr.hcl"

jobs:
  packer-validation:
    runs-on: ubuntu-latest
    name: Validate Packer Configuration
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      - name: Run packer fmt check
        id: fmt
        run: |
          if ! packer fmt -check *.pkr.hcl; then
            echo "Error: Packer files are not properly formatted"
            echo "Run 'packer fmt' to format the files"
            exit 1
          fi

      - name: Run packer validate
        id: validate
        env:
          aws_region: ${{ secrets.AWS_REGION }}
          aws_profile: ${{ secrets.AWS_PROFILE }}
          gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          gcp_zone: ${{ secrets.GCP_ZONE }}
          gcp_private_key_id: ${{ secrets.GCP_PRIVATE_KEY_ID }}
          gcp_private_key: ${{ secrets.GCP_PRIVATE_KEY }}
          gcp_client_email: ${{ secrets.GCP_CLIENT_EMAIL }}
          gcp_client_id: ${{ secrets.GCP_CLIENT_ID }}
          db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          packer validate *.pkr.hcl
